services:
  - type: web
    name: terrapulse-touchgrass
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    plan: starter
    region: oregon
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SENTRY_DSN
        sync: false
      - key: GEMMA_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        value: JBFqnCBsd6RMkjVDRZzb
